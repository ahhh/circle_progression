<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coltrane Circle</title>
<meta name="description" content="An interactive circle of fifths, Coltrane circle, chromatic circle and diatonic circle: build chord progressions, see the geometry they draw, and explore the songs, colors and lore behind them.">
<meta name="theme-color" content="#0a0c18">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="The Coltrane Circle">
<meta property="og:description" content="Build chord progressions on the circle of fifths, Coltrane’s circle, the chromatic clock or a key’s diatonic heptagon, and watch them draw geometric patterns, with the songs, moods and lore behind them.">
<meta property="og:image" content="assets/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c18;
    --bg-2: #141735;
    --panel: rgba(18, 21, 42, 0.86);
    --panel-2: rgba(30, 34, 64, 0.7);
    --ink: #eee7d4;
    --muted: #a19db3;
    --faint: #66627c;
    --gold: #e8b85a;
    --gold-ink: #1b1405;
    --line: rgba(238, 231, 212, 0.09);
    --line-2: rgba(238, 231, 212, 0.18);
    --radius: 14px;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1100px 760px at 50% 38%, var(--bg-2) 0%, var(--bg) 62%) fixed, var(--bg);
    color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  #sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  #sky i { position: absolute; border-radius: 50%; background: #fff8e6; }

  /* ---------- header ---------- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: rgba(10, 12, 24, 0.6); backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; flex-direction: column; margin-right: auto; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 27px; line-height: 1; margin: 0; letter-spacing: .01em; }
  h1 em { color: var(--gold); font-style: italic; }
  .brand small { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; background: rgba(0,0,0,.3); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; }
  .seg button.on { background: var(--gold); color: var(--gold-ink); font-weight: 600; }
  .btn {
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .btn:hover { border-color: var(--gold); }
  .btn:active { transform: translateY(1px); }
  .btn.on { background: rgba(232, 184, 90, .16); border-color: var(--gold); color: var(--gold); }
  .btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .4; cursor: default; }
  .divider { width: 1px; height: 22px; background: var(--line-2); }

  /* ---------- layout ---------- */
  main {
    display: grid; grid-template-columns: 330px minmax(0, 1fr) 330px; gap: 16px;
    padding: 16px 20px 28px; max-width: 1680px; margin: 0 auto;
  }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .panel h2 {
    font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 12px 0 6px; font-weight: 500; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .info {
    display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%;
    border: 1px solid var(--line-2); color: var(--muted); font: 600 11px var(--sans); cursor: help; flex: none;
  }
  .info:hover { color: var(--gold); border-color: var(--gold); }

  #stage { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  #wheel { width: 100%; max-width: min(860px, calc(100vh - 110px)); aspect-ratio: 1; display: block; touch-action: manipulation; user-select: none; }
  .stage-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
  .rot-read { font-family: var(--mono); font-size: 12px; color: var(--muted); align-self: center; }

  /* ---------- builder ---------- */
  .roots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .roots button, .quals button {
    border: 1px solid var(--line-2); background: rgba(0,0,0,.2); border-radius: 8px; padding: 6px 0; cursor: pointer;
    font-family: var(--serif); font-size: 17px; font-weight: 600; position: relative;
  }
  .quals { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .quals button { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 7px 0; }
  .roots button.on, .quals button.on { border-color: var(--gold); background: rgba(232,184,90,.16); color: var(--gold); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; }
  .key-line { font-family: var(--serif); font-size: 18px; }
  .key-line b { color: var(--gold); font-weight: 600; }

  .prog { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 44px; padding: 8px; border: 1px dashed var(--line-2); border-radius: 10px; }
  .prog .empty { color: var(--faint); font-size: 12.5px; }
  .chip {
    display: inline-flex; flex-direction: column; align-items: center; gap: 0; padding: 4px 9px 3px; border-radius: 9px;
    background: rgba(255,255,255,.05); border: 1px solid var(--line-2); cursor: pointer; position: relative; min-width: 42px;
  }
  .chip b { font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1.1; }
  .chip i { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .chip:hover { border-color: #ff6b6b; }
  .chip.playing { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(232,184,90,.35); }
  .arrow { width: 14px; height: 3px; border-radius: 2px; }

  .sugs { display: flex; flex-direction: column; gap: 6px; }
  .sug {
    display: grid; grid-template-columns: 72px 1fr auto; gap: 2px 10px; align-items: center; text-align: left;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 10px; padding: 7px 10px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .sug:hover { border-color: var(--gold); background: rgba(232,184,90,.07); }
  .sug .nm { font-family: var(--serif); font-size: 19px; font-weight: 700; grid-row: span 2; line-height: 1; }
  .sug .nm small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-weight: 400; margin-top: 3px; }
  .sug .tt { font-weight: 500; font-size: 13px; line-height: 1.25; }
  .sug .ty { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sug .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .sug .str { grid-row: span 2; font-family: var(--mono); font-size: 11px; color: var(--gold); letter-spacing: 1px; }

  /* ---------- right column ---------- */
  .shape-name { font-family: var(--serif); font-size: 23px; font-weight: 600; line-height: 1.15; margin: 0 0 4px; }
  .swatch-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .orb { width: 34px; height: 34px; border-radius: 50%; flex: none; box-shadow: 0 0 18px currentColor; }
  .bars { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .bar { display: grid; grid-template-columns: 110px 1fr 22px; gap: 8px; align-items: center; font-size: 12px; cursor: help; }
  .bar .track { height: 6px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bar .fill { display: block; height: 100%; border-radius: 4px; }
  .bar .ct { font-family: var(--mono); color: var(--muted); text-align: right; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12px; margin: 0 4px 4px 0; cursor: help; }
  .elems { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .elem { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 5px 0; font-size: 11.5px; cursor: help; }
  .elem b { display: block; font-family: var(--serif); font-size: 19px; }

  .songs { display: flex; flex-direction: column; gap: 8px; }
  .song { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: rgba(255,255,255,.025); }
  .song .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .song .hd b { font-family: var(--serif); font-size: 16.5px; font-weight: 600; }
  .badge { font-family: var(--mono); font-size: 10px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.exact { color: #5fd38d; } .badge.sim { color: var(--gold); } .badge.next { color: #3fc6ff; }
  .song .ro { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .song ul { margin: 4px 0 0; padding-left: 16px; font-size: 12.5px; }
  .song .nx { margin-top: 6px; font-size: 12px; }
  .song .nx button { padding: 2px 9px; font-size: 12px; }

  .legend { display: flex; flex-direction: column; gap: 4px; }
  .lg { display: flex; align-items: center; gap: 9px; font-size: 12.5px; cursor: help; padding: 3px 4px; border-radius: 6px; }
  .lg:hover { background: rgba(255,255,255,.04); }
  .lg .ln { width: 26px; height: 3px; border-radius: 2px; flex: none; }
  .lg .as { margin-left: auto; color: var(--muted); font-size: 11.5px; }

  details.lore { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  details.lore:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  details.lore summary { cursor: pointer; font-family: var(--serif); font-size: 17px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.lore summary::after { content: "+"; color: var(--gold); font-family: var(--sans); }
  details.lore[open] summary::after { content: "–"; }
  details.lore p { font-size: 13px; color: #d4cdbb; margin: 6px 0; }

  /* ---------- svg ---------- */
  .sec { cursor: pointer; transition: fill-opacity .15s, stroke .15s; stroke: rgba(238,231,212,.14); stroke-width: 1; }
  .sec:hover { fill-opacity: .55 !important; stroke: var(--gold); }
  .sec.empty { cursor: default; fill: rgba(255,255,255,.015); stroke: rgba(238,231,212,.05); }
  .sec.empty:hover { fill-opacity: 1 !important; stroke: rgba(238,231,212,.05); }
  .lbl { pointer-events: none; }
  .note { font-family: var(--serif); font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .sub { font-family: var(--mono); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
  .edge-hit { stroke: transparent; stroke-width: 18; cursor: help; }
  .node-n { font-family: var(--mono); font-size: 11px; font-weight: 500; fill: #fff4d6; fill-opacity: .8; text-anchor: middle; dominant-baseline: central; }
  .sugmark { cursor: pointer; }
  @keyframes pulse { 0%,100% { opacity: .95; } 50% { opacity: .35; } }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes dash { to { stroke-dashoffset: -40; } }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .twinkle { animation: twinkle 3.4s ease-in-out infinite; }
  .preview { stroke-dasharray: 8 7; animation: dash 1.2s linear infinite; }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; z-index: 100; pointer-events: none; max-width: 330px;
    background: rgba(12, 14, 30, .97); border: 1px solid var(--line-2); border-radius: 12px;
    padding: 11px 13px; font-size: 12.8px; line-height: 1.5; color: #ddd6c3;
    box-shadow: 0 14px 40px rgba(0,0,0,.55); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;
  }
  #tip.show { opacity: 1; transform: none; }
  #tip h4 { margin: 0 0 4px; font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--ink); }
  #tip p { margin: 4px 0; }
  #tip .k { color: var(--gold); }
  #tip .m { color: var(--muted); font-size: 11.5px; }
  #tip hr { border: 0; border-top: 1px solid var(--line-2); margin: 7px 0; }

  @media (max-width: 1240px) {
    main { grid-template-columns: 320px minmax(0, 1fr); }
    #right { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
  }
  @media (max-width: 800px) {
    header { padding: 12px 16px; position: static; }
    main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 24px; }
    #stage { order: -1; }
    #right { display: flex; }
    .divider { display: none; }
    .sug { grid-template-columns: 66px 1fr auto; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>The <em>Coltrane</em> Circle</h1>
    <small>Progressions, geometry &amp; the music of the spheres</small>
  </div>
  <div class="controls">
    <div class="seg" id="modes" role="tablist" aria-label="Circle mode"></div>
    <span class="divider"></span>
    <button class="btn" id="rotL" title="Rotate −7.5° (←)" data-tip="info:rotate">⟲</button>
    <button class="btn" id="rotR" title="Rotate +7.5° (→)" data-tip="info:rotate">⟳</button>
    <button class="btn" id="drift" data-tip="info:drift">Drift</button>
    <span class="divider"></span>
    <button class="btn primary" id="rand" data-tip="info:random">✦ Randomize</button>
    <button class="btn" id="mandala" data-tip="info:mandala">✺ Mandala</button>
    <span class="divider"></span>
    <button class="btn on" id="tAstro" data-tip="info:astro">♈︎ Astrology</button>
    <button class="btn on" id="tSound" data-tip="info:sound">♪ Sound</button>
  </div>
</header>

<main>
  <!-- LEFT: progression builder -->
  <section class="col" id="left">
    <div class="panel">
      <h2>Start a progression <span class="info" data-tip="info:builder">?</span></h2>
      <h3>Root</h3>
      <div class="roots" id="roots"></div>
      <h3>Chord quality</h3>
      <div class="quals" id="quals"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="addBtn">Start with C</button>
        <button class="btn ghost" id="undo" title="Undo (Backspace)">Undo</button>
        <button class="btn ghost" id="clear">Clear</button>
        <button class="btn" id="play" title="Play (Space)">▶ Play</button>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="hint" style="display:flex;gap:6px;align-items:center;cursor:pointer" data-tip="info:sevenths">
          <input type="checkbox" id="sev"> Use seventh chords for clicks &amp; suggestions
        </label>
      </div>
    </div>

    <div class="panel">
      <h2>Your progression</h2>
      <p class="key-line" id="keyLine"></p>
      <div class="prog" id="prog"></div>
    </div>

    <div class="panel">
      <h2>What could come next <span class="info" data-tip="info:suggestions">?</span></h2>
      <div class="sugs" id="sugs"></div>
    </div>
  </section>

  <!-- CENTER: the wheel -->
  <section id="stage">
    <svg id="wheel" viewBox="-446 -446 892 892" aria-label="Circle of fifths">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="nebula" cx="0.38" cy="0.4" r="0.7">
          <stop offset="0" stop-color="#5a3c8c" stop-opacity=".22"/>
          <stop offset=".45" stop-color="#23306e" stop-opacity=".12"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="hubGrad" r="0.5">
          <stop offset="0" stop-color="#1d2148"/>
          <stop offset="1" stop-color="#0d0f22"/>
        </radialGradient>
      </defs>
      <g id="rot">
        <g id="gStatic"></g>
        <g id="gGhost"></g>
        <g id="gLines"></g>
        <g id="gPreview"></g>
        <g id="gNodes"></g>
      </g>
    </svg>
    <div class="stage-bar">
      <span class="rot-read" id="rotRead">0.0°</span>
      <button class="btn ghost" id="rotReset">Reset rotation</button>
      <button class="btn ghost" id="clearGhosts" data-tip="info:ghosts">Clear pattern layers</button>
    </div>
  </section>

  <!-- RIGHT: analysis -->
  <section class="col" id="right">
    <div class="panel">
      <h2>Pattern <span class="info" data-tip="info:shapes">?</span></h2>
      <div id="analysis"></div>
    </div>
    <div class="panel">
      <h2>Famous songs <span class="info" data-tip="info:songs">?</span></h2>
      <div class="songs" id="songs"></div>
    </div>
    <div class="panel">
      <h2>Line colors &amp; moods</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <h2>Lore</h2>
      <div id="lore"></div>
    </div>
  </section>
</main>

<noscript><p style="text-align:center;padding:40px">The Coltrane Circle needs JavaScript to draw the wheel.</p></noscript>
<div id="sky" aria-hidden="true"></div>
<div id="tip" role="tooltip"></div>

<script>
'use strict';

/* =========================================================
   Music data
   ========================================================= */
const NOTE = ['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const FIFTHS = [0,7,2,9,4,11,6,1,8,3,10,5];          // circle position -> pitch class
const mod = (n, m = 12) => ((n % m) + m) % m;
const fIdx = pc => mod(mod(pc) * 7);                   // pitch class -> circle position
const INTERVAL = ['unison','minor 2nd','major 2nd','minor 3rd','major 3rd','perfect 4th','tritone','perfect 5th','minor 6th','major 6th','minor 7th','major 7th'];

const QUAL = {
  M:    { sym: '',     name: 'major triad',             fam: 'maj', iv: [0,4,7] },
  m:    { sym: 'm',    name: 'minor triad',             fam: 'min', iv: [0,3,7] },
  '7':  { sym: '7',    name: 'dominant seventh',        fam: 'dom', iv: [0,4,7,10] },
  maj7: { sym: 'maj7', name: 'major seventh',           fam: 'maj', iv: [0,4,7,11] },
  m7:   { sym: 'm7',   name: 'minor seventh',           fam: 'min', iv: [0,3,7,10] },
  dim:  { sym: '°',    name: 'diminished triad',        fam: 'dim', iv: [0,3,6] },
  m7b5: { sym: 'ø7',   name: 'half-diminished seventh', fam: 'dim', iv: [0,3,6,10] },
};
const QORDER = ['M','m','7','maj7','m7','dim','m7b5'];
const famOf = c => QUAL[c.q].fam;
const chordName = c => NOTE[c.root] + QUAL[c.q].sym;
const chordNotes = c => QUAL[c.q].iv.map(i => NOTE[mod(c.root + i)]).join(' · ');
const sameChord = (a, b) => a && b && a.root === b.root && a.q === b.q;

const ZOD = [
  { n:'Aries',       g:'♈', el:'Fire',  mo:'Cardinal', ru:'Mars',             kw:'initiative, spark, the first push' },
  { n:'Taurus',      g:'♉', el:'Earth', mo:'Fixed',    ru:'Venus',            kw:'stability, sensuality, groundedness' },
  { n:'Gemini',      g:'♊', el:'Air',   mo:'Mutable',  ru:'Mercury',          kw:'curiosity, wit, duality' },
  { n:'Cancer',      g:'♋', el:'Water', mo:'Cardinal', ru:'the Moon',         kw:'nurture, memory, home' },
  { n:'Leo',         g:'♌', el:'Fire',  mo:'Fixed',    ru:'the Sun',          kw:'radiance, drama, the heart' },
  { n:'Virgo',       g:'♍', el:'Earth', mo:'Mutable',  ru:'Mercury',          kw:'precision, craft, service' },
  { n:'Libra',       g:'♎', el:'Air',   mo:'Cardinal', ru:'Venus',            kw:'balance, harmony, the pivot point' },
  { n:'Scorpio',     g:'♏', el:'Water', mo:'Fixed',    ru:'Mars / Pluto',     kw:'intensity, depth, transformation' },
  { n:'Sagittarius', g:'♐', el:'Fire',  mo:'Mutable',  ru:'Jupiter',          kw:'expansion, the quest, far horizons' },
  { n:'Capricorn',   g:'♑', el:'Earth', mo:'Cardinal', ru:'Saturn',           kw:'structure, ambition, endurance' },
  { n:'Aquarius',    g:'♒', el:'Air',   mo:'Fixed',    ru:'Saturn / Uranus',  kw:'innovation, the collective, surprise' },
  { n:'Pisces',      g:'♓', el:'Water', mo:'Mutable',  ru:'Jupiter / Neptune',kw:'dreams, dissolution, the mystic' },

const CIRCLE_ORDER = ['western', 'coltrane', 'chromatic', 'diatonic'];
const nodePos = c => circle().pos(c, keyOf());

/* =========================================================
   Suggestions
   ========================================================= */
function suggest(prog = S.prog) {
  if (!prog.length) return [];
  const C = circle(), k = keyOf(prog), last = prog[prog.length - 1], r = last.root;
  const fam = famOf(last), deg = mod(r - k.tonic);
  const list = [];
  const add = (root, q, title, why, score, tag) => {
    root = mod(root);
    list.push({ chord: { root, q: adaptQ(q, mod(root - k.tonic)) }, title, why, score: score * (C.bias[tag] ?? 1), tag });
  };
  const diat = root => { const d = (k.minor ? MIN_D : MAJ_D)[mod(root - k.tonic)]; return d ? DIAT_Q[d] : null; };

  // 1. functional table for diatonic chords
  const expect = (k.minor ? MIN_D : MAJ_D)[deg];
  const f = fam === 'dom' ? 'maj' : fam;
  if (expect && (expect === f || (k.minor && deg === 7))) {
    (k.minor ? MIN_T : MAJ_T)[deg].forEach(([d, q, t, w, s]) => add(k.tonic + d, q, t, w, s, 'function'));
  }

  // 2. down a fifth
  if (fam === 'dom') add(r + 5, diat(r + 5) || 'M', 'Resolve the dominant',
    `${chordName(last)} has a tritone inside it (its 3rd and 7th) that wants to collapse inward, so it falls a fifth to ${NOTE[mod(r+5)]}.`, 4, 'fifth');
  else add(r + 5, diat(r + 5) || (fam === 'min' ? 'm' : 'M'), 'Next step around the circle',
    `Moving down a fifth is the strongest, most natural root motion.`, 2.2, 'fifth');

  // 3. relative major / minor
  if (fam === 'maj' || fam === 'dom') add(r + 9, 'm', 'Relative minor', `${NOTE[mod(r+9)]}m uses the same key signature as ${NOTE[r]}. Same notes, darker light.`, 1.6, 'relative');
  if (fam === 'min') add(r + 3, 'M', 'Relative major', `${NOTE[mod(r+3)]} shares ${NOTE[r]}m’s key signature. Same notes, brighter light.`, 1.6, 'relative');

  // 4. tritone substitution
  if (fam === 'dom') {
    add(r + 6, '7', 'Tritone substitution', `${NOTE[mod(r+6)]}7 has the same tritone (the 3rd and 7th swap places) as ${chordName(last)}, so it can stand in for it. The bass jumps a tritone.`, 1.8, 'tritone');
    add(r - 1, 'M', 'Half-step resolution', `If ${chordName(last)} is acting as a tritone sub, it slides down a half step to ${NOTE[mod(r-1)]}.`, 1.4, 'tritone');
  }
  if (fam === 'min') add(r + 11, '7', 'Tritone-sub dominant (♭II7)',
    `Instead of the V7 after ${chordName(last)}, use ${NOTE[mod(r+11)]}7: same guide tones, with a bass line that slides down in half steps.`, 1.7, 'tritone');

  // 5. Coltrane major-third cycles
  if (fam === 'maj') {
    add(r + 3, '7', 'Coltrane pivot', `In Giant Steps style, ${NOTE[mod(r+3)]}7 is the V7 of ${NOTE[mod(r+8)]}, a key a major third below ${NOTE[r]}. It sets up a jump to a new tonal center.`, 1.1, 'coltrane');
    add(r + 8, 'M', 'Giant step down', `Jump straight to ${NOTE[mod(r+8)]}, a major third down: one side of Coltrane’s triangle (a trine).`, 1, 'coltrane');
    add(r + 4, 'M', 'Giant step up', `Leap a major third up to ${NOTE[mod(r+4)]}. Same triangle, other direction.`, 0.9, 'coltrane');
    add(r + 11, '7', 'Pivot to the upper center', `${NOTE[mod(r+11)]}7 is the V7 of ${NOTE[mod(r+4)]}, the center a major third up.`, 0.6, 'coltrane');
  }

  // 6. secondary dominants & borrowed chords (major keys)
  if (!k.minor) {
    add(k.tonic + 4, '7', 'Secondary dominant V7/vi', `${NOTE[mod(k.tonic+4)]}7 borrows a dominant aimed at vi (${NOTE[mod(k.tonic+9)]}m). Gospel and soul love this move.`, 1.3, 'secondary');
    add(k.tonic + 2, '7', 'Secondary dominant V7/V', `${NOTE[mod(k.tonic+2)]}7 is the “dominant of the dominant”: it pushes hard toward V.`, 1.3, 'secondary');
    add(k.tonic + 10, 'M', 'Borrowed ♭VII', `${NOTE[mod(k.tonic+10)]} comes from the parallel minor / Mixolydian mode. Big, open, rock-anthem sound.`, 1.2, 'borrowed');
    add(k.tonic + 8, 'M', 'Borrowed ♭VI', `${NOTE[mod(k.tonic+8)]} from the parallel minor. Cinematic and heroic.`, 1.1, 'borrowed');
  }

  // 7. moves native to the current circle
  C.extraSugs?.({ k, last, r, fam, deg, add });

  // 8. home
  if (deg !== 0 || fam !== (k.minor ? 'min' : 'maj'))
    add(k.tonic, k.minor ? 'm' : 'M', 'Return home', `Land on the tonic, ${keyName(k)}, to close the shape.`, 1.8, 'home');

  // de-duplicate (root + family), keep strongest
  const best = new Map();
  for (const s of list) {
    if (s.chord.root === last.root && famOf(s.chord) === fam) continue;
    const id = s.chord.root + famOf(s.chord);
    if (!best.has(id) || best.get(id).score < s.score) best.set(id, s);
  }
  return [...best.values()].sort((a, b) => b.score - a.score).slice(0, 9);
}

/* =========================================================
   Song matching (transposition-invariant)
   ========================================================= */
function matchSongs(prog = S.prog) {
  const n = prog.length, out = [];
  if (n < 2) return out;
  for (const s of SONGS) {
    const Q = s.q, m = Q.length;
    let best = null;
    for (let i = 0; i < n; i++) for (let t = 0; t < m; t++) {
      let L = 0;
      while (i + L < n && t + L < m &&
             mod(prog[i + L].root - prog[i].root) === mod(Q[t + L].d - Q[t].d) &&
             compat(FAMCODE[famOf(prog[i + L])], Q[t + L].f)) L++;
      const tail = i + L === n && t + L < m;
      if (!best || L > best.L || (L === best.L && tail && !best.tail)) best = { L, i, t, tail };
    }
    if (!best || best.L < 2) continue;
    const exact = best.L === m;
    if (!exact && best.L < 3 && !best.tail) continue;
    const off = prog[best.i].root - Q[best.t].d;
    const inKey = Q.map(x => NOTE[mod(x.d + off)] + ({ M:'', m:'m', '7':'7', d:'°' })[x.f]).join(' – ');
    const next = best.tail && !exact ? { root: mod(Q[best.t + best.L].d + off), q: CODE_Q[Q[best.t + best.L].f] } : null;
    out.push({ s, L: best.L, m, exact, next, inKey });
  }
  out.sort((a, b) => (b.exact - a.exact) || (b.L - a.L) || (b.L / b.m - a.L / a.m));
  // two-chord "heading toward" hits are common, so keep only a couple of them
  let weak = 0;
  return out.filter(x => x.L > 2 || x.exact || ++weak <= 2).slice(0, 6);
}

/* =========================================================
   Geometry analysis
   ========================================================= */
function edgesOf(prog) {
  // each progression is placed against its own key, so ghost layers line up by function on the diatonic wheel
  const C = circle(), k = keyOf(prog), pts = prog.map(c => C.pos(c, k)), E = [];
  for (let i = 1; i < prog.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if (a.idx === b.idx && a.r === b.r) continue;
    E.push({ i, a, b, d: ringDist(a.idx, b.idx), x: !!(a.alt || b.alt) });
  }
  return { pts, E };
}
function hexMix(cols) {
  if (!cols.length) return '#e8b85a';
  let r = 0, g = 0, b = 0;
  cols.forEach(c => { r += parseInt(c.slice(1,3),16); g += parseInt(c.slice(3,5),16); b += parseInt(c.slice(5,7),16); });
  const h = v => Math.round(v / cols.length).toString(16).padStart(2,'0');
  return '#' + h(r) + h(g) + h(b);
}
function analyze(prog = S.prog) {
  const C = circle(), EDGE = C.edges, { pts, E } = edgesOf(prog);
  const counts = {}; E.forEach(e => counts[e.d] = (counts[e.d] || 0) + 1);
  const order = Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a] || b - a);
  const dom = order[0], sec = order[1];
  let name, feel;
  if (!prog.length) { name = 'An empty sky'; feel = 'Pick a starting chord on the left, or click any key on the wheel.'; }
  else if (!E.length) { name = 'A single star'; feel = 'One point of light. Add a second chord to draw your first line.'; }
  else if (order.length === 1) { name = EDGE[dom].shape; feel = EDGE[dom].feel; }
  else {
    name = `${EDGE[dom].short} constellation`;
    feel = `${EDGE[dom].feel} Accents of ${EDGE[sec].short.toLowerCase()} (${EDGE[sec].name.toLowerCase()}) add ${EDGE[sec].acc}.`;
  }
  const closed = prog.length > 2 && sameChord(prog[0], prog[prog.length - 1]);
  const color = hexMix(E.map(e => EDGE[e.d].color));
  const A = { prog, pts, E, counts, name, feel, closed, color };
  A.figs = C.figures(A).filter(f => S.astro || !f.astro);
  return A;
}

function polySvg(pts, color, op) {
  if (new Set(pts.map(p => p.idx + ':' + p.r)).size < 3) return '';
  return `<polygon points="${ptsAttr(pts.map(p => polar(p.r, p.idx)))}" fill="${color}" fill-opacity="${op}" fill-rule="evenodd" stroke="none"/>`;
}

function renderDynamic() {
  const C = circle();
  // ghosts: earlier patterns, kept as layers of the mandala
  let g = '';
  S.ghosts.forEach(prog => {
    const { pts, E } = edgesOf(prog);
    g += polySvg(pts, hexMix(E.map(e => C.edges[e.d].color)), 0.035);
    E.forEach(e => g += edgeSvg(e.a, e.b, e.d, { w: 1.6, op: 0.32, x: e.x }));
    new Set(pts.map(p => p.idx + ':' + p.r)).forEach(key => {
      const [idx, r] = key.split(':').map(Number), [x, y] = polar(r, idx);
      g += `<circle cx="${f2(x)}" cy="${f2(y)}" r="2.2" fill="#fff8e6" fill-opacity=".45"/>`;
    });
  });
  gGhost.innerHTML = g;

  // current progression
  const A = analyze();
  const last = S.prog[S.prog.length - 1], shown = S.prog[S.playing] || last;
  let l = C.overlay && shown ? C.overlay(shown) : '';
  l += polySvg(A.pts, A.color, 0.1);
  A.E.forEach(e => l += edgeSvg(e.a, e.b, e.d, { glow: true, tip: `edge:${e.i}`, x: e.x }));
  gLines.innerHTML = l;

  // highlight last chord's sector, nodes, suggestion markers
  let h = '';
  const k = keyOf();
  h += label(0, -16, k ? keyName(k).toUpperCase() : (C.hubTitle ? C.hubTitle() : C.title), 'sub', 13, 'fill-opacity=".55" letter-spacing="3"');
  h += label(0, 26, last ? chordName(last) : '✦', 'note', 46, 'fill-opacity=".22"');
  if (last) {
    const p = nodePos(last);
    h += `<path d="${arcPath(p.band[0], p.band[1], p.idx, 0.2)}" fill="none" stroke="#e8b85a" stroke-width="3" class="pulse lbl" style="pointer-events:none"/>`;
  }
  S.sugs.forEach((s, i) => {
    const p = nodePos(s.chord), lp = nodePos(last);
    const d = ringDist(lp.idx, p.idx);
    const [x, y] = polar(p.r, p.idx);
    h += `<circle class="sugmark" cx="${f2(x)}" cy="${f2(y)}" r="9" fill="rgba(10,12,24,.8)" stroke="${C.edges[d].color}" stroke-width="2" stroke-dasharray="3 3" data-act="sug" data-i="${i}" data-tip="sug:${i}"/>`;
  });
  const seen = new Map();
  S.prog.forEach((c, i) => { const p = nodePos(c); seen.set(p.idx + ':' + p.r, i); });
  seen.forEach(i => {
    const p = nodePos(S.prog[i]);
    const [x, y] = polar(p.r, p.idx);
    const isLast = i === S.prog.length - 1, isPlay = i === S.playing;
    const big = isLast || isPlay;
    h += `<circle cx="${f2(x)}" cy="${f2(y)}" r="${big ? 7 : 5}" fill="${big ? '#ffd57a' : '#fff4d6'}" filter="url(#glow)"/>`;
    h += `<circle cx="${f2(x)}" cy="${f2(y)}" r="12" fill="transparent" data-tip="chip:${i}" style="cursor:help"/>`;
    const [lx, ly] = polar(p.r - 24, p.idx);
    h += label(lx, ly, i + 1, 'node-n', 11);
  });
  gNodes.innerHTML = h;
  renderPreview();
  collectLabels();
}

function renderPreview() {
  const last = S.prog[S.prog.length - 1];
  if (S.preview == null || !last || !S.sugs[S.preview]) { gPreview.innerHTML = ''; return; }
  const a = nodePos(last), b = nodePos(S.sugs[S.preview].chord);
  gPreview.innerHTML = edgeSvg(a, b, ringDist(a.idx, b.idx), { w: 2.6, op: .9, cls: 'preview' });
}

function collectLabels() {
  labels = [...document.querySelectorAll('#wheel .lbl[data-x]')];
  applyRotation(true);
}
let lastApplied = null;
function applyRotation(force) {
  const r = S.rotation;
  if (!force && lastApplied !== null && Math.abs(lastApplied - r) < 0.001) return;
  lastApplied = r;
  $('rot').setAttribute('transform', `rotate(${f2(r)})`);
  for (const el of labels) el.setAttribute('transform', `rotate(${f2(-r)} ${el.dataset.x} ${el.dataset.y})`);
  $('rotRead').textContent = `${mod(r, 360).toFixed(1)}°`;
}
function tick() {
  if (S.drift) S.rotTarget += 0.05;
  S.rotation += (S.rotTarget - S.rotation) * 0.14;
  if (Math.abs(S.rotTarget - S.rotation) < 0.002) S.rotation = S.rotTarget;
  applyRotation();
  requestAnimationFrame(tick);
}

function tipEdge(i) {
  const C = circle(), k = keyOf(), a = S.prog[i - 1], b = S.prog[i];
  const pa = C.pos(a, k), pb = C.pos(b, k), d = ringDist(pa.idx, pb.idx), E = C.edges[d];
  const up = mod(b.root - a.root);
  const motion = up === 0 ? 'same root' : up <= 6 ? `up a ${INTERVAL[up]}` : `down a ${INTERVAL[12 - up]}`;
  const note = C.edgeNote?.(a, b, d, pa, pb);
  let h = `<h4>${chordName(a)} → ${chordName(b)}</h4>`;
  h += `<p><span style="color:${E.color}">━</span> <span class="k">${E.name}</span> · ${E.ang} on the circle</p>`;
  h += `<p>Root motion: ${motion}.${note ? ' ' + note : ''}</p>`;
  h += `<p>${E.feel}</p>`;
  if (S.astro) h += `<hr><p>${E.asp}: <span class="m">${E.astro}</span></p>`;
  return h;
}

function tipFor(key) {
  const [t, a, b] = key.split(':');
  const C = circle();
  switch (t) {
    case 'info': return INFO[a] || '';
    case 'mode': return CIRCLES[a]?.info || '';
    case 'note': return C.tipNote(+a, b);
    case 'pick': return C.tipNote(+a, 'M');
    case 'ring': return C.tipRing?.(a === 'out') || '';
    case 'edge': return tipEdge(+a);
    case 'sug': {
      const s = S.sugs[+a]; if (!s) return '';
      const last = S.prog[S.prog.length - 1], d = ringDist(nodePos(last).idx, nodePos(s.chord).idx), E = C.edges[d];
      return `<h4>${chordName(s.chord)} <span class="m">${roman(s.chord)}</span></h4><p class="k">${s.title}</p><p>${s.why}</p>
        <p class="m">${chordNotes(s.chord)}</p><hr><p><span style="color:${E.color}">━</span> draws a ${E.short.toLowerCase()} line (${E.ang}). ${E.feel}</p>
        ${S.astro ? `<p class="m">${E.asp}: ${E.astro}</p>` : ''}`;
    }

        ${S.astro ? `<p class="m">${C.astroChip(nodePos(c))}</p>` : ''}<p class="m">Click the chip to remove this chord.</p>`;
    }
    case 'legend': {
      const E = C.edges[+a];
      return `<h4 style="color:${E.color}">${E.short}</h4><p class="m">${E.name} · ${E.ang} · makes a ${E.shape.toLowerCase()}</p><p>${E.feel}</p><p class="m">Example: ${C.examples[+a]}</p>${S.astro ? `<hr><p>${E.asp}: <span class="m">${E.astro}</span></p>` : ''}`;
    }
    case 'fig': { const f = analysisCache?.figs[+a]; return f ? `<h4>${f.n}</h4><p>${f.d}</p>` : ''; }
    case 'elem': {
      const e = ELEM[a];
      const signs = ZOD.map((z, i) => z.el === a ? `${z.g}︎ ${NOTE[C.slotPc(i)]}` : null).filter(Boolean).join('  ');
      return `<h4 style="color:${e.c}">${a}</h4><p>${e.mood}.</p><p class="m">Keys: ${signs}. Together they form an augmented triad.</p>`;
    }
    case 'func': {
      const F = FUNC[a], k = dKey(), D = dia(k);
      const list = D.scale.filter(r => D.func[r] === a).map(r => chordName(diaChord(r, k))).join(', ');
      return `<h4 style="color:${F.c}">${F.n}</h4><p>${F.mood}.</p><p class="m">${list ? `In ${keyName(k)}: ${list}.` : 'Chords whose root lies outside the key.'}</p>`;
    }
    case 'qual': return `<h4>${QUAL[a].name}</h4><p class="m">Built from intervals ${QUAL[a].iv.join(', ')} (semitones above the root). Example on C: ${chordNotes({ root: 0, q: a })}</p>`;
  }
  return '';
}

const tip = $('tip');
let tipEl = null;
function placeTip(x, y) {
  const w = tip.offsetWidth, h = tip.offsetHeight, pad = 14;
  let left = x + pad, top = y + pad;
  if (left + w > innerWidth - 8) left = Math.max(8, x - w - pad);
  if (top + h > innerHeight - 8) top = Math.max(8, y - h - pad);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (el === tipEl) return;
  tipEl = el;
  if (!el) { tip.classList.remove('show'); return; }
  const html = tipFor(el.dataset.tip);
  if (!html) { tip.classList.remove('show'); return; }
  tip.innerHTML = html; tip.classList.add('show'); placeTip(e.clientX, e.clientY);
  // hovering a suggestion previews its line
  if (el.dataset.act === 'sug') { const i = +el.dataset.i; if (S.preview !== i) { S.preview = i; renderPreview(); } }
});
document.addEventListener('mousemove', e => { if (tipEl) placeTip(e.clientX, e.clientY); });
document.addEventListener('mouseout', e => {
  if (!e.relatedTarget || !e.relatedTarget.closest) { tip.classList.remove('show'); tipEl = null; }
  const from = e.target.closest?.('[data-act="sug"]'), to = e.relatedTarget?.closest?.('[data-act="sug"]');
  if (from && !to && S.preview != null) { S.preview = null; renderPreview(); }
});

/* =========================================================
   Audio
   ========================================================= */
let actx = null, master = null;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0.22;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    master.connect(lp); lp.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function playChord(c, delay = 0, dur = 1.3) {
  if (!S.sound) return;
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + delay + 0.02;
  const base = 55 + mod(c.root - 7);                 // keep roots between G3 and F♯4
  const notes = [base - 12, ...QUAL[c.q].iv.map(i => base + i)];
  notes.forEach((m, j) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = j === 0 ? 'sine' : 'triangle';
    o.frequency.value = mtof(m);
    o.detune.value = (Math.random() - .5) * 6;
    const peak = (j === 0 ? 0.5 : 0.32) / Math.sqrt(notes.length);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.025);
    g.gain.exponentialRampToValueAtTime(peak * 0.45, t0 + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0 + j * 0.012); o.stop(t0 + dur + 0.05);
  });
}
let playTimers = [];
function playProg() {
  playTimers.forEach(clearTimeout); playTimers = [];
  if (!S.prog.length) return;
  const step = 0.85;
  S.prog.forEach((c, i) => {
    playChord(c, i * step, 1.25);
    playTimers.push(setTimeout(() => { S.playing = i; renderProg(); renderDynamic(); }, i * step * 1000));
  });
  playTimers.push(setTimeout(() => { S.playing = -1; renderProg(); renderDynamic(); }, S.prog.length * step * 1000 + 200));
}

/* =========================================================
   Actions
   ========================================================= */
function addChord(c, sound = true) {
  S.prog.push({ root: mod(c.root), q: c.q });
  if (sound) playChord(c);
  update();
}
function pushGhost() {
  if (S.prog.length > 1) { S.ghosts.push(S.prog.slice()); if (S.ghosts.length > 14) S.ghosts.shift(); }
}
function clickQuality(root, ring) {
  // prefer the quality of a matching suggestion, so clicks follow the harmony
  const fam = ring === 'm' ? 'min' : ring === 'M' ? 'maj' : null;
  const match = S.sugs.find(s => s.chord.root === root && (!fam || famOf(s.chord) === fam || (fam === 'maj' && famOf(s.chord) === 'dom')));
  if (match) return match.chord.q;
  const k = keyOf(), C = circle();
  if (C.clickQ) return C.clickQ(root, ring, k);
  return adaptQ(ring === 'm' ? 'm' : 'M', k ? mod(root - k.tonic) : 0);
}
const rnd = n => Math.floor(Math.random() * n);
function randomProg() {
  const root = rnd(12), C = circle();
  if (Math.random() < 0.4) {
    const s = SONGS[rnd(SONGS.length)];
    return s.q.map(x => ({ root: mod(x.d + root), q: adaptQ(CODE_Q[x.f], x.d) }));
  }
  const prog = [{ root, q: C.startQ ? C.startQ() : (Math.random() < 0.7 ? adaptQ('M', 0) : adaptQ('m', 0)) }];
  const len = 4 + rnd(4);
  while (prog.length < len) {
    const opts = suggest(prog).slice(0, 6);
    if (!opts.length) break;
    const w = opts.map(o => o.score * o.score), tot = w.reduce((a, b) => a + b, 0);
    let x = Math.random() * tot, pick = opts[0];
    for (let i = 0; i < opts.length; i++) { x -= w[i]; if (x <= 0) { pick = opts[i]; break; } }
    prog.push(pick.chord);
  }
  return prog;
}
function randomize() {
  pushGhost();
  S.prog = randomProg();
  S.pickRoot = S.prog[0].root; S.pickQ = S.prog[0].q;
  update(); playProg();
}
function mandala() {
  pushGhost();
  for (let i = 0; i < 6; i++) { S.ghosts.push(randomProg()); }
  while (S.ghosts.length > 14) S.ghosts.shift();
  S.prog = randomProg();
  S.rotTarget += 15;
  update(); playProg();
}
function setMode(m) {
  S.mode = m;
  $('wheel').setAttribute('aria-label', circle().aria);
  fullRender();
}
function toggle(btn, key) { S[key] = !S[key]; $(btn).classList.toggle('on', S[key]); fullRender(); }
function rotate(deg) { S.rotTarget += deg; }
function pick(change) {
  change();
  playChord({ root: S.pickRoot, q: S.pickQ });
  // before the first chord, the builder's pick is the diatonic wheel's key
  if (circle().keyed && !S.prog.length) update(); else renderBuilder();
}

/* =========================================================
   Wiring
   ========================================================= */
$('modes').onclick = e => { const b = e.target.closest('[data-mode]'); if (b && b.dataset.mode !== S.mode) setMode(b.dataset.mode); };
$('rotL').onclick = () => rotate(-7.5);
$('rotR').onclick = () => rotate(7.5);
$('rotReset').onclick = () => { S.drift = false; $('drift').classList.remove('on'); S.rotTarget = Math.round(S.rotation / 360) * 360; };
$('drift').onclick = () => { S.drift = !S.drift; $('drift').classList.toggle('on', S.drift); };
$('rand').onclick = randomize;
$('mandala').onclick = mandala;
$('tAstro').onclick = () => toggle('tAstro', 'astro');
$('tSound').onclick = () => { S.sound = !S.sound; $('tSound').classList.toggle('on', S.sound); };
$('sev').onchange = e => { S.sevenths = e.target.checked; update(); };
$('addBtn').onclick = () => addChord({ root: S.pickRoot, q: S.pickQ });
$('undo').onclick = () => { S.prog.pop(); update(); };
$('clear').onclick = () => { pushGhost(); S.prog = []; update(); };
$('play').onclick = playProg;
$('clearGhosts').onclick = () => { S.ghosts = []; renderDynamic(); };
$('roots').onclick = e => { const b = e.target.closest('[data-root]'); if (b) pick(() => S.pickRoot = +b.dataset.root); };
$('quals').onclick = e => { const b = e.target.closest('[data-q]'); if (b) pick(() => S.pickQ = b.dataset.q); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'add') { const root = +el.dataset.root; addChord({ root, q: clickQuality(root, el.dataset.ring) }); }
  else if (act === 'sug') { const s = S.sugs[+el.dataset.i]; if (s) addChord(s.chord); }
  else if (act === 'rm') { S.prog.splice(+el.dataset.i, 1); tip.classList.remove('show'); tipEl = null; update(); }
  else if (act === 'songnext') { const m = songCache[+el.dataset.i]; if (m?.next) addChord({ root: m.next.root, q: adaptQ(m.next.q, mod(m.next.root - keyOf().tonic)) }); }
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') { rotate(-7.5); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { rotate(7.5); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') randomize();
  else if (e.key === ' ') { playProg(); e.preventDefault(); }
  else if (e.key === 'Backspace') { S.prog.pop(); update(); e.preventDefault(); }
});

(() => {
  const rnd = seeded(42), sky = $('sky');
  let h = '';
  for (let i = 0; i < 220; i++) {
    const s = 0.6 + rnd() * rnd() * 2.2;
    h += `<i style="left:${f2(rnd() * 100)}%;top:${f2(rnd() * 100)}%;width:${f2(s)}px;height:${f2(s)}px;opacity:${f2(0.15 + rnd() * 0.55)}"${rnd() < 0.1 ? ' class="twinkle"' : ''}></i>`;
  }
  sky.innerHTML = h;
})();
fullRender();
requestAnimationFrame(tick);
</script>
</body>
